name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tools-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install tools-only package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify tools-only contract
        run: pytest tests/test_packaging.py tests/test_tool_*.py -v

  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[eval,dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest tests/ -v
